
name: Build Web APK

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare App Configuration
        if: github.event_name == 'repository_dispatch'
        env:
          APP_URL: ${{ github.event.client_payload.url }}
          APP_NAME: ${{ github.event.client_payload.appName }}
          APP_ID: ${{ github.event.client_payload.packageName }}
          APP_ICON: ${{ github.event.client_payload.icon }}
        run: |
          mkdir -p app/src/main/assets

          python3 - <<'PY'
          import os, json, base64, re
          from pathlib import Path

          url = os.environ["APP_URL"]
          name = os.environ["APP_NAME"]
          package = os.environ["APP_ID"]
          icon = os.environ.get("APP_ICON", "")

          if not url.startswith(("https://", "http://")):
              raise SystemExit("Invalid URL")

          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", package):
              raise SystemExit("Invalid package name")

          if not name.strip():
              raise SystemExit("App name is required")

          Path("app/src/main/assets/config.json").write_text(
              json.dumps({"url": url, "name": name})
          )

          if icon:
              icon = icon.split(",", 1)[-1]
              Path("/tmp/icon.png").write_bytes(base64.b64decode(icon))
          PY

          if [ -f /tmp/icon.png ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick

            mkdir -p app/src/main/res/mipmap-mdpi
            mkdir -p app/src/main/res/mipmap-hdpi
            mkdir -p app/src/main/res/mipmap-xhdpi
            mkdir -p app/src/main/res/mipmap-xxhdpi
            mkdir -p app/src/main/res/mipmap-xxxhdpi

            convert /tmp/icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert /tmp/icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert /tmp/icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert /tmp/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert /tmp/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          echo "$APP_ID" > app-id.txt
          echo "$APP_NAME" > app-name.txt

      - name: Build APK
        run: |
          if [ -f app-id.txt ]; then
            gradle --no-daemon assembleDebug \
              -PappId="$(cat app-id.txt)" \
              -PappName="$(cat app-name.txt)"
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebToAPK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
