
name: ELVOXI WebToAPK Build

on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      WEB_URL: ${{ github.event.client_payload.url }}
      APP_NAME: ${{ github.event.client_payload.appName }}
      APP_PACKAGE: ${{ github.event.client_payload.packageName }}
      APP_ICON: ${{ github.event.client_payload.icon }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$WEB_URL" || -z "$APP_NAME" || -z "$APP_PACKAGE" ]]; then
            echo "ERROR: Payload HTML tidak lengkap."
            exit 1
          fi

          if [[ ! "$WEB_URL" =~ ^https?:// ]]; then
            echo "ERROR: URL harus menggunakan HTTP atau HTTPS."
            exit 1
          fi

          if [[ ! "$APP_PACKAGE" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo "ERROR: Package name tidak valid."
            exit 1
          fi

          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle-project

          export PROJECT_DIR="$GITHUB_WORKSPACE"

          python - <<'PY'
          import os, re, html, base64, io
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          package = os.environ["APP_PACKAGE"]
          app_name = html.escape(os.environ["APP_NAME"])
          web_url = os.environ["WEB_URL"]

          package_dir = root / "app/src/main/java" / package.replace(".", "/")
          package_dir.mkdir(parents=True, exist_ok=True)

          (root / "settings.gradle").write_text("""
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ELVOXI-WebToAPK'
          include ':app'
          """.strip() + "\n")

          (root / "build.gradle").write_text("""
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          """.strip() + "\n")

          (root / "gradle.properties").write_text("""
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          """.strip() + "\n")

          (root / "app/build.gradle").write_text("""
          plugins {
              id 'com.android.application'
          }

          android {
              namespace System.getenv('APP_PACKAGE')
              compileSdk 35

              defaultConfig {
                  applicationId System.getenv('APP_PACKAGE')
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildFeatures {
                  buildConfig true
              }

              defaultConfig {
                  buildConfigField "String", "WEB_URL",
                      '"' + System.getenv('WEB_URL').replace('\\\\', '\\\\\\\\').replace('"', '\\\\"') + '"'
              }
          }
          """.strip() + "\n")

          (root / "app/src/main/res/values").mkdir(parents=True, exist_ok=True)
          (root / "app/src/main/res/values/strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\\n'
              '<resources><string name="app_name">' + app_name +
              '</string></resources>'
          )

          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """
          (root / "app/src/main/AndroidManifest.xml").write_text(manifest)

          java = f'''package {package};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.view.View;
          import android.graphics.Color;

          public class MainActivity extends Activity {{
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);
                  webView.loadUrl(BuildConfig.WEB_URL);
              }}

              @Override
              public void onBackPressed() {{
                  if (webView != null && webView.canGoBack()) {{
                      webView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          '''
          (package_dir / "MainActivity.java").write_text(java)

          # Generate app icon from the HTML payload, or create a fallback.
          from PIL import Image, ImageDraw

          icon_data = os.environ.get("APP_ICON", "")
          image = None

          try:
              if icon_data.startswith("data:") and "," in icon_data:
                  raw = base64.b64decode(icon_data.split(",", 1)[1])
                  image = Image.open(io.BytesIO(raw)).convert("RGBA")
          except Exception:
              image = None

          if image is None:
              image = Image.new("RGBA", (192, 192), (18, 18, 18, 255))
              draw = ImageDraw.Draw(image)
              draw.rounded_rectangle((16, 16, 176, 176), radius=35,
                                     fill=(150, 15, 35, 255))
              draw.text((55, 78), "E", fill="white")

          image.thumbnail((192, 192))
          canvas = Image.new("RGBA", (192, 192), (18, 18, 18, 255))
          canvas.alpha_composite(image, ((192-image.width)//2, (192-image.height)//2))
          canvas.save(root / "app/src/main/res/drawable/ic_launcher.png")
          PY

      - name: Install Python image library
        run: pip install Pillow

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebToAPK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
