name: Build WebToApk

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Website URL"
        required: true
        type: string
      app_name:
        description: "App Name"
        required: true
        type: string
      package_name:
        description: "Package Name"
        required: true
        type: string
      splash_text:
        description: "Splash Text"
        required: false
        default: "ELVOXI"
        type: string
      splash_duration:
        description: "Splash Duration (ms)"
        required: false
        default: "1500"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/${{ inputs.package_name }}
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

          PACKAGE_PATH=$(echo "${{ inputs.package_name }}" | tr '.' '/')

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WebToApk"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '${{ inputs.package_name }}'
              compileSdk 35

              defaultConfig {
                  applicationId '${{ inputs.package_name }}'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="splash_bg">#080808</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/splash_bg</item>
                  <item name="android:navigationBarColor">@color/splash_bg</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="${{ inputs.app_name }}"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/${PACKAGE_PATH}/MainActivity.java <<EOF
          package ${{ inputs.package_name }};

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final long SPLASH_TIME =
                      ${{
                        inputs.splash_duration
                      }}L;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  showSplash();
              }

              private void showSplash() {

                  LinearLayout splash = new LinearLayout(this);
                  splash.setOrientation(LinearLayout.VERTICAL);
                  splash.setGravity(Gravity.CENTER);
                  splash.setBackgroundColor(Color.rgb(8, 8, 8));

                  TextView title = new TextView(this);
                  title.setText("${{ inputs.splash_text }}");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);

                  splash.addView(title);

                  setContentView(splash);

                  splash.postDelayed(() -> openWebsite(), SPLASH_TIME);
              }

              private void openWebsite() {

                  WebView web = new WebView(this);

                  web.setWebViewClient(new WebViewClient());

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  web.loadUrl("${{ inputs.website_url }}");

                  setContentView(web);
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -e
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
            "output/${{ inputs.app_name }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebToAPK
          path: output/*.apk
