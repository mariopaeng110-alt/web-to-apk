plugins {
    id 'com.android.application'
}

android {
    namespace 'com.webtoapk.app'
    compileSdk 35

    defaultConfig {
        applicationId project.findProperty("appId") ?: "com.webtoapk.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        resValue "string", "app_name",
                project.findProperty("appName") ?: "Web To APK"
    }
}
